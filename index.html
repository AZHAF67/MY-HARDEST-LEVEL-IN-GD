<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hardest Levels</title>
    
    <!-- Verified Google MediaPipe Tracking Framework Files -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #111;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            transition: 0.3s;
            background: linear-gradient(150deg, cyan, lightblue);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px aliceblue;
            background: linear-gradient(150deg, lightblue, cyan);
            color: black;
        }
        .cam-container { 
            position: relative; 
            display: inline-block;
            margin: 0 auto;
            width: 640px;
            height: 480px;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors the screen to match standard webcam views */
        }
        .overlay-glasses { 
            position: absolute; 
            width: 120px;           
            height: 120px;
            pointer-events: none; 
            z-index: 9999;      
            transform: translate(-50%, -50%); /* Locks center coordinates to the track point */
            display: none;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">My Hardest Levels</h1>

    <div class="button-container">
        <a href="https://gdladder.com/level/114532158" target="_blank"><button>Troll madness</button></a>
        <a href="https://gdladder.com/level/4284013" target="_blank"><button>Nine Circles</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Crazy</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Future Funk</button></a>
        <a href="https://gdladder.com/level/5155022" target="_blank"><button>Acropolis</button></a>
    </div>

    <div class="cam-container">
        <video id="v" playsinline width="640" height="480"></video>
        <img id="cube" class="overlay-glasses" src="Geometry_Dash-removebg-preview.png" alt="GD Character Face">
    </div>

    <script>
        const videoElement = document.getElementById('v');
        const cube = document.getElementById('cube');

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://jsdelivr.net{file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Point 168 is the absolute center of your face right between your eyes
                const noseBridge = landmarks[168]; 
                
                // Track your forehead and chin to measure depth scale dynamically
                const forehead = landmarks[10];
                const chin = landmarks[152];
                const faceHeight = Math.abs(chin.y - forehead.y) * 480;

                // Map coordinates cleanly onto our 640x480 container grid
                const xPos = noseBridge.x * 640;
                const yPos = noseBridge.y * 480;

                // Scale the Geometry Dash cube size depending on how close your head moves
                const dynamicSize = faceHeight * 1.3;

                cube.style.left = `${xPos}px`;
                cube.style.top = `${yPos}px`;
                cube.style.width = `${dynamicSize}px`;
                cube.style.height = `${dynamicSize}px`;
                cube.style.display = 'block';
            } else {
                cube.style.display = 'none';
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        
        camera.start();
    </script>

</body>
</html>
