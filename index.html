<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hardest Levels</title>
    <!-- 1. Download the Face Tracking library engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #111;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            transition: 0.3s;
            background: linear-gradient(150deg, cyan, lightblue);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px aliceblue;
            background: linear-gradient(150deg, lightblue, cyan);
            color: black;
        }
        /* The container for the tracking window */
        .cam-container { 
            position: relative; 
            display: inline-block;
            margin: 0 auto;
            width: 640px;
            height: 480px;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        /* The live tracking canvas element */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* The GD Cube Mask that will move dynamically */
        .overlay-glasses { 
            position: absolute; 
            width: 120px; /* Size of the cube */
            height: 120px;
            pointer-events: none; 
            z-index: 9999;
            transform: translate(-50%, -50%); /* Centers tracking coordinates */
            display: none; /* Hidden until a face is found */
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">My Hardest Levels</h1>

    <div class="button-container">
        <a href="https://gdladder.com" target="_blank"><button>Troll madness</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Nine Circles</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Crazy</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Future Funk</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Acropolis</button></a>
    </div>

    <div class="cam-container">
        <!-- The library uses a canvas element instead of a raw video tag to process tracking -->
        <canvas id='jeeFaceFilterCanvas'></canvas>
        <img id="cube" class="overlay-glasses" src="Geometry_Dash-removebg-preview.png" alt="GD Character Face">
    </div>

    <script>
        const cube = document.getElementById('cube');
        const container = document.querySelector('.cam-container');

        // Initialize the face tracking engine
        JEELIZFACEFILTER.init({
            canvasId: 'jeeFaceFilterCanvas',
            NNCPath: 'https://jsdelivr.net', // Neural network pathway
            callbackReady: function(errCode, spec) {
                if (errCode) {
                    console.log('Tracking initialization failed', errCode);
                    return;
                }
                console.log('Tracking engine ready!');
            },
            // This function runs continuously on every single video frame
            callbackTrack: function(detectState) {
                // Check if a face is clearly visible in the camera
                if (detectState.detected > 0.6) {
                    // Get face coordinates scaled to the canvas box dimensions
                    const x = (0.5 + detectState.x) * 640;
                    const y = (0.5 - detectState.y) * 480;
                    const scale = detectState.s * 350; // Scales size based on distance

                    // Instantly shift the cube location to match your face
                    cube.style.left = x + 'px';
                    cube.style.top = y + 'px';
                    cube.style.width = scale + 'px';
                    cube.style.height = scale + 'px';
                    cube.style.display = 'block';
                } else {
                    // Hide the cube if you step away from the camera frame
                    cube.style.display = 'none';
                }
            }
        });
    </script>

</body>
</html>
