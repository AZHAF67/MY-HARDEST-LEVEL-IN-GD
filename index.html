<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hardest Levels</title>
    <!-- Imports the absolute bulletproof face tracking framework -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #111;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            transition: 0.3s;
            background: linear-gradient(150deg, cyan, lightblue);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px aliceblue;
            background: linear-gradient(150deg, lightblue, cyan);
            color: black;
        }
        .cam-container { 
            position: relative; 
            display: inline-block;
            margin: 0 auto;
            width: 640px;
            height: 480px;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors the webcam feed so it looks normal */
        }
        .overlay-glasses { 
            position: absolute; 
            width: 150px;           
            height: 150px;
            pointer-events: none; 
            z-index: 9999;      
            transform: translate(-50%, -50%); /* Keeps character centered directly on your nose tracking point */
            display: none;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">My Hardest Levels</h1>

    <div class="button-container">
        <a href="https://gdladder.com" target="_blank"><button>Troll madness</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Nine Circles</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Crazy</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Future Funk</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Acropolis</button></a>
    </div>

    <div class="cam-container">
        <video id="v" autoplay playsinline width="640" height="480"></video>
        <img id="cube" class="overlay-glasses" src="Geometry_Dash-removebg-preview.png" alt="GD Character Face">
    </div>

    <script>
        const video = document.getElementById('v');
        const cube = document.getElementById('cube');
        let model;

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        async function main() {
            await setupCamera();
            video.play();

            // Load the official Google MediaPipe Face Detection engine model
            model = await faceLandmarksDetection.load(
                faceLandmarksDetection.SupportedPackages.mediapipeFacemesh,
                { maxFaces: 1 }
            );

            trackFace();
        }

        async function trackFace() {
            const predictions = await model.estimateFaces({ input: video });

            if (predictions.length > 0) {
                // Target landmark point 4 is the exact center tip of your nose
                const nose = predictions[0].annotations.noseTip[0];
                
                // Get your face borders to calculate tracking scale distances
                const topLeft = predictions[0].boundingBox.topLeft;
                const bottomRight = predictions[0].boundingBox.bottomRight;
                const faceWidth = bottomRight[0] - topLeft[0];

                // Map coordinates cleanly to the absolute canvas layout
                // (Using 640 - nose[0] compensates perfectly for the mirrored camera effect)
                const xPos = 640 - nose[0];
                const yPos = nose[1];

                // Dynamically scale the size of the cube based on how close you sit to the camera
                const dynamicSize = faceWidth * 1.2;

                cube.style.left = `${xPos}px`;
                cube.style.top = `${yPos}px`;
                cube.style.width = `${dynamicSize}px`;
                cube.style.height = `${dynamicSize}px`;
                cube.style.display = 'block';
            } else {
                cube.style.display = 'none';
            }

            // Loop smoothly at 60 frames per second
            requestAnimationFrame(trackFace);
        }

        main();
    </script>

</body>
</html>
