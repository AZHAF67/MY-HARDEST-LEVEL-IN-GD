<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hardest Levels</title>
    
    <!-- Ultra Lightweight 60 FPS Face Tracker -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            background-color: #111;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            transition: 0.3s;
            background: linear-gradient(150deg, cyan, lightblue);
            color: #111;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px aliceblue;
            background: linear-gradient(150deg, lightblue, cyan);
            color: black;
        }
        .cam-container { 
            position: relative; 
            display: inline-block;
            margin: 0 auto;
            width: 640px;
            height: 480px;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors webcam view */
        }
        .overlay-glasses { 
            position: absolute; 
            pointer-events: none; 
            z-index: 9999;      
            display: none;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">My Hardest Levels</h1>

    <div class="button-container">
        <a href="https://gdladder.com" target="_blank"><button>Troll madness</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Nine Circles</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Crazy</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Future Funk</button></a>
        <a href="https://gdladder.com" target="_blank"><button>Acropolis</button></a>
    </div>

    <div class="cam-container">
        <video id="v" preload autoplay loop muted width="640" height="480"></video>
        <img id="cube" class="overlay-glasses" src="Geometry_Dash-removebg-preview.png" alt="GD Character Face">
    </div>

    <script>
        const video = document.getElementById('v');
        const cube = document.getElementById('cube');

        // Setup the lightweight face scanner
        const tracker = new tracking.ObjectTracker('face');
        tracker.setInitialScale(4);
        tracker.setStepSize(2);
        tracker.setEdgesDensity(0.1);

        // Turn on tracking loop
        tracking.track('#v', tracker, { camera: true });

        // Runs instantly when your face moves
        tracker.on('track', function(event) {
            if (event.data.length === 0) {
                cube.style.display = 'none';
            } else {
                event.data.forEach(function(rect) {
                    // Calculate perfectly mirrored left placement alignment
                    const mirroredLeft = 640 - rect.x - rect.width;

                    // Instantly lock cube dimensions over your face box layout
                    cube.style.left = mirroredLeft + 'px';
                    cube.style.top = (rect.y - 20) + 'px'; // Adjusted slightly up to sit on head better
                    cube.style.width = rect.width + 'px';
                    cube.style.height = rect.height + 'px';
                    cube.style.display = 'block';
                });
            }
        });
    </script>

</body>
</html>
